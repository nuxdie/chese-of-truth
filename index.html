<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1526">
<title>Cheese of Truth</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#ffc93c;
    --yellow-deep:#e8a317;
    --purple:#7b4bd6;
    --purple-deep:#4c2a8f;
    --cyan:#2fd0c0;
    --cyan-deep:#159a8e;
    --red:#ff5a5f;
    --ink:#170f22;
    --paper:#f7efdd;
    --paper-shade:#e6d9bd;
    --gold:#ffd45e;
    --safe-t:0px; --safe-b:0px;
    --app-h:100dvh;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{
    height:100%;
    overflow:hidden;
    background:#0d0916;   /* matches the app's outer gradient, so no seam can show */
    overscroll-behavior:none;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }

  #app{
    position:fixed;
    inset:0;
    height:100%;
    overflow:hidden;
    touch-action:none;
    /* room lighting */
    background:
      radial-gradient(120% 70% at 50% 8%, #3b2a5e 0%, #241a3c 42%, #150f24 72%, #0d0916 100%);
  }

  /* ---------- grain + vignette ---------- */
  #app::after{
    content:'';
    position:absolute;inset:0;
    pointer-events:none;
    z-index:60;
    background:
      radial-gradient(115% 78% at 50% 42%, transparent 42%, rgba(8,4,16,.55) 100%);
    mix-blend-mode:multiply;
  }
  .grain{
    position:absolute;inset:-40%;
    pointer-events:none;
    z-index:61;
    opacity:.16;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.55'/></svg>");
    animation:grainshift 1.1s steps(3) infinite;
  }
  @keyframes grainshift{
    0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}
  }

  /* the whole diorama is authored at 390x780 and scaled to the phone as one unit,
     so the composition never stretches or leaves a dead zone */
  #scene{
    position:absolute;
    left:50%;
    margin-left:-195px;
    width:390px;
    height:780px;
    transform-origin:top center;
    z-index:5;
  }

  /* ---------- the table ---------- */
  .table{
    position:absolute;
    left:-40%;right:-40%;
    top:42%;
    bottom:-22%;
    z-index:1;
    background:
      radial-gradient(90% 120% at 50% 100%, rgba(255,214,120,.14), transparent 62%),
      linear-gradient(#5b3f86 0%, #47306b 26%, #35234f 100%);
    border-top:3px solid rgba(255,255,255,.09);
    border-radius:52% 52% 0 0 / 9% 9% 0 0;
    box-shadow:0 -24px 60px rgba(0,0,0,.5);
  }
  .table::before{
    content:'';
    position:absolute;inset:0;
    border-radius:inherit;
    opacity:.34;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='rgba(255,255,255,.34)' stroke-width='2.4' stroke-linecap='round'><path d='M16 6v20M6 16h20'/><path d='M48 38v18M39 47h18'/></g><circle cx='48' cy='14' r='2.2' fill='rgba(255,255,255,.22)'/><circle cx='14' cy='48' r='2.2' fill='rgba(255,255,255,.22)'/></svg>");
    background-size:44px 44px;
    mask-image:linear-gradient(to bottom, transparent, #000 22%);
  }
  /* spotlight pool on the cloth */
  .pool{
    position:absolute;
    left:50%;top:40%;
    width:150%;height:52%;
    transform:translateX(-50%);
    z-index:2;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,228,168,.22), transparent 64%);
    pointer-events:none;
  }

  /* ---------- top chrome (tiny) ---------- */
  .chrome{
    position:absolute;
    top:calc(var(--safe-t) + 10px);
    left:0;right:0;
    height:38px;
    z-index:62;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    pointer-events:none;
  }
  .pip{
    pointer-events:auto;
    display:flex;align-items:center;gap:6px;
    height:32px;padding:0 12px 0 9px;
    border-radius:16px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(8px);
    color:#ffe6a8;
    font-size:13px;font-weight:700;
    font-variant-numeric:tabular-nums;
    opacity:0;transform:translateY(-6px);
    transition:opacity .45s, transform .45s;
  }
  .pip.on{opacity:1;transform:none}
  .pip svg{width:16px;height:16px;display:block}
  #sound{
    pointer-events:auto;
    width:32px;height:32px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(8px);
    display:grid;place-items:center;
    cursor:pointer;
    color:rgba(255,255,255,.62);
    margin-left:auto;
  }
  #sound svg{width:16px;height:16px;display:block}
  #sound.muted{color:rgba(255,255,255,.3)}

  /* ---------- book ---------- */
  #book{
    position:absolute;
    z-index:6;
    left:50%;
    top:13%;
    width:330px;
    aspect-ratio:1.42/1;
    transform:translateX(-56%) perspective(700px) rotateX(21deg) rotate(-4deg);
    transform-style:preserve-3d;
    filter:drop-shadow(0 26px 26px rgba(0,0,0,.45));
  }
  .page{
    position:absolute;
    top:0;bottom:0;
    width:50.4%;
    background:linear-gradient(180deg,var(--paper),var(--paper-shade));
    overflow:hidden;
    padding:9% 8%;
  }
  .page.l{left:0;border-radius:7px 2px 2px 7px;transform-origin:right center;transform:rotateY(7deg);box-shadow:inset -16px 0 20px -14px rgba(72,48,20,.55)}
  .page.r{right:0;border-radius:2px 7px 7px 2px;transform-origin:left center;transform:rotateY(-7deg);box-shadow:inset 16px 0 20px -14px rgba(72,48,20,.55)}
  /* A phone webview will not render 4px type honestly - it boosts it, or clamps it to a
     minimum size, and the page came out huge and gap-ridden on device. So set the column
     at a normal size and scale the whole block down; the metrics stay exact. */
  .page .lines{
    font-family:'PT Serif',Georgia,'Times New Roman',serif;
    font-size:11px;
    line-height:18.5px;
    color:rgba(86,62,34,.5);
    text-align:justify;
    letter-spacing:.25px;
    width:250%;
    transform:scale(.4);
    transform-origin:top left;
  }
  .bookttl{
    display:block;
    font-size:16.5px;
    line-height:22px;
    font-weight:700;
    font-style:normal;
    text-align:center;
    margin-bottom:7px;
    color:rgba(120,74,30,.8);
  }
  .spine{
    position:absolute;
    left:50%;top:-1%;bottom:-1%;
    width:5%;
    transform:translateX(-50%);
    background:linear-gradient(90deg, rgba(60,38,12,.05), rgba(60,38,12,.42) 46%, rgba(60,38,12,.42) 54%, rgba(60,38,12,.05));
    border-radius:2px;
  }

  /* ---------- machine ---------- */
  #machine{
    position:absolute;
    z-index:12;
    left:50%;
    bottom:4%;
    width:368px;
    transform:translateX(-50%);
  }
  #machine svg{display:block;width:100%;height:auto;overflow:visible}
  .breathe{animation:breathe 2.6s ease-in-out infinite;transform-origin:160px 205px}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  #invite{transition:opacity .3s}
  .rip{transform-box:fill-box;transform-origin:center;animation:rip 2.4s cubic-bezier(.2,.7,.3,1) infinite}
  .rip.r2{animation-delay:1.2s}
  @keyframes rip{
    0%{transform:scale(.62);opacity:0}
    18%{opacity:.75}
    100%{transform:scale(1.5);opacity:0}
  }


  /* ---------- flying cheese ---------- */
  #fly{
    position:absolute;
    z-index:30;
    width:74px;height:74px;
    left:0;top:0;
    will-change:transform;
    display:none;
    filter:drop-shadow(0 10px 12px rgba(0,0,0,.4));
  }
  #fly svg{display:block;width:100%;height:100%}

  /* ---------- reveal ---------- */
  #reveal{
    position:absolute;
    inset:0;
    z-index:70;
    display:none;
    opacity:0;
    transition:opacity .5s ease;
    background:var(--paper);
    overflow:hidden;
  }
  #reveal.on{opacity:1}
  .revealpage{
    position:absolute;inset:0;
    padding:calc(var(--safe-t) + 26px) 22px calc(var(--safe-b) + 26px);
    font-family:'PT Serif',Georgia,'Times New Roman',serif;
    font-size:14px;
    line-height:25px;
    color:rgba(74,54,28,.5);
    hyphens:none;
    text-align:justify;
    background:
      radial-gradient(120% 80% at 50% 30%, #fdf7e9, var(--paper) 55%, #e4d5b6 100%);
    overflow:hidden;
  }
  .revealpage span{transition:color .35s ease, text-shadow .35s ease}
  /* whatever word a hole happened to land on */
  .revealpage span.pick{
    color:#14100a;
    -webkit-text-stroke:.4px #14100a;
    text-stroke:.4px #14100a;
    text-shadow:0 0 18px rgba(255,186,40,.75);
  }
  #cheesewrap{
    position:absolute;
    left:50%;top:41%;
    width:min(74vw,326px);
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    will-change:transform;
  }
  #cheesezoom{
    position:absolute;inset:0;
    transform-origin:center center;
    filter:drop-shadow(0 18px 26px rgba(90,60,20,.3));
  }
  #cheesezoom svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block}

  .verdict{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:96px 24px calc(var(--safe-b) + 22px);
    z-index:5;
    background:linear-gradient(transparent, rgba(21,13,32,.55) 18%, rgba(19,12,29,.94) 46%, #130c1d 70%);
    text-align:center;
    opacity:0;
    transform:translateY(18px);
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.9,.3,1);
    pointer-events:none;
  }
  .verdict.on{opacity:1;transform:none;pointer-events:auto}
  .verdict p{
    font-family:'Playfair Display','PT Serif',Georgia,serif;
    font-weight:900;
    font-size:clamp(21px,6.4vw,29px);
    line-height:1.16;
    color:var(--gold);
    letter-spacing:-.2px;
    text-wrap:balance;
  }
  .verdict small{
    display:block;
    margin-top:10px;
    font-family:'PT Serif',Georgia,serif;
    font-style:italic;
    font-size:12.5px;
    color:rgba(255,255,255,.38);
  }
  #again{
    margin:20px auto 0;
    width:62px;height:62px;
    border:none;
    border-radius:50%;
    background:var(--yellow);
    color:#2b1c0c;
    display:grid;place-items:center;
    box-shadow:0 6px 0 var(--yellow-deep), 0 14px 26px rgba(0,0,0,.45);
    cursor:pointer;
    transition:transform .09s, box-shadow .09s;
  }
  #again:active{transform:translateY(5px);box-shadow:0 1px 0 var(--yellow-deep), 0 6px 14px rgba(0,0,0,.4)}
  #again svg{width:28px;height:28px;display:block}

  /* flash on landing */
  #flash{
    position:absolute;inset:0;z-index:65;
    background:radial-gradient(60% 40% at 50% 32%, #fffaea, #ffe9a8 60%, rgba(255,233,168,0) 100%);
    opacity:0;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="app">
  <div class="grain"></div>
  <div id="scene">
  <div class="table"></div>
  <div class="pool"></div>

  <!-- the oracle book -->
  <div id="book">
    <div class="page l"><div class="lines" id="pageL"></div></div>
    <div class="page r"><div class="lines" id="pageR"></div></div>
    <div class="spine"></div>
  </div>

  <!-- the flipp-o-matic -->
  <div id="machine">
    <svg viewBox="0 0 320 250" aria-hidden="true">
      <defs>
        <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd75e"/><stop offset="1" stop-color="#e8a317"/>
        </linearGradient>
        <linearGradient id="gCore" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9a6bf0"/><stop offset="1" stop-color="#5b31ad"/>
        </linearGradient>
        <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#54e6d6"/><stop offset="1" stop-color="#159a8e"/>
        </linearGradient>
        <linearGradient id="gCheese" x1="0" y1="0" x2=".75" y2="1">
          <stop offset="0" stop-color="#ffe693"/><stop offset=".42" stop-color="#ffc93c"/><stop offset="1" stop-color="#eda51c"/>
        </linearGradient>
        <linearGradient id="gGauge" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#2fd0c0"/><stop offset=".55" stop-color="#ffd45e"/><stop offset="1" stop-color="#ff5a5f"/>
        </linearGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <!-- ground shadow -->
      <ellipse cx="160" cy="234" rx="96" ry="15" fill="rgba(0,0,0,.45)" filter="url(#soft)"/>

      <!-- power gauge (behind everything, the arm sweeps it like a needle) -->
      <g id="gauge" opacity="0">
        <path id="gaugeTrack" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="8" stroke-linecap="round"/>
        <path id="gaugeSweet" fill="none" stroke="rgba(255,212,94,.34)" stroke-width="14" stroke-linecap="round"/>
        <path id="gaugeFill"  fill="none" stroke="url(#gGauge)" stroke-width="8" stroke-linecap="round"/>
      </g>

      <g class="breathe" id="rig">
        <!-- arm, pivoting at 160,205 -->
        <g id="arm">
          <rect x="152" y="104" width="16" height="104" rx="8" fill="url(#gArm)" stroke="#150d20" stroke-width="5"/>
          <path d="M126 68h68a6 6 0 0 1 6 6v16c0 16-14 26-40 26s-40-10-40-26V74a6 6 0 0 1 6-6z" fill="url(#gArm)" stroke="#150d20" stroke-width="5"/>
          <path d="M133 76h54v12c0 10-11 16-27 16s-27-6-27-16z" fill="rgba(255,255,255,.18)"/>
          <g id="load" opacity="0"></g>
          <circle id="muzzle" cx="160" cy="72" r="0" fill="none"/>
        </g>

        <!-- body -->
        <path d="M62 208c0-46 44-80 98-80s98 34 98 80c0 9-5 14-14 14H76c-9 0-14-5-14-14z" fill="url(#gBody)" stroke="#150d20" stroke-width="6"/>
        <path d="M80 206c0-38 36-66 80-66" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="7" stroke-linecap="round"/>
        <path d="M62 205c0 10 6 17 16 17h164c10 0 16-7 16-17" fill="rgba(0,0,0,.16)"/>
        <!-- purple core -->
        <ellipse cx="160" cy="182" rx="52" ry="40" fill="url(#gCore)" stroke="#150d20" stroke-width="6"/>
        <ellipse cx="146" cy="168" rx="20" ry="13" fill="rgba(255,255,255,.2)" transform="rotate(-22 146 168)"/>
        <!-- press-and-hold invitation -->
        <g id="invite">
          <circle class="rip r1" cx="160" cy="182" r="40" fill="none" stroke="#ffd45e" stroke-width="3"/>
          <circle class="rip r2" cx="160" cy="182" r="40" fill="none" stroke="#ffd45e" stroke-width="3"/>
        </g>
        <!-- tension dots that light up while winding -->
        <g id="dots">
          <circle cx="121" cy="201" r="6"/><circle cx="134" cy="197.6" r="6"/><circle cx="147" cy="195.6" r="6"/>
          <circle cx="160" cy="195" r="6"/><circle cx="173" cy="195.6" r="6"/><circle cx="186" cy="197.6" r="6"/>
          <circle cx="199" cy="201" r="6"/>
        </g>
        <!-- crank -->
        <g id="crank" transform="rotate(0 254 196)">
          <rect x="248" y="189" width="54" height="14" rx="7" fill="#ffd75e" stroke="#150d20" stroke-width="5"/>
          <circle cx="300" cy="196" r="11" fill="var(--red)" stroke="#150d20" stroke-width="5"/>
        </g>
        <circle cx="254" cy="196" r="8" fill="#150d20"/>
        <!-- feet -->
        <rect x="74" y="216" width="34" height="14" rx="7" fill="#150d20"/>
        <rect x="212" y="216" width="34" height="14" rx="7" fill="#150d20"/>
      </g>

      <!-- cheese pack sitting on the table -->
      <g id="pack" opacity=".95">
        <rect x="2" y="186" width="60" height="46" rx="9" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.4)" stroke-width="3"/>
        <g transform="translate(12,190) scale(.4)">
          <path id="packCheese" fill="url(#gCheese)" stroke="#b9821a" stroke-width="3" fill-rule="evenodd"/>
        </g>
      </g>
    </svg>
  </div>

  </div><!-- /scene -->

  <div class="chrome">
    <div class="pip" id="score">
      <svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M7 4h10a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM9 7.2a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2zm6.3 3.1a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4zM9.8 13.6a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 0 0 0-3.8z"/></svg>
      <span id="scoreN">0</span>
    </div>
    <div id="sound" aria-label="sound">
      <svg id="sndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg id="sndOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
    </div>
  </div>

  <div id="fly"></div>
  <div id="flash"></div>

  <!-- the truth -->
  <div id="reveal">
    <div class="revealpage" id="revealPage"></div>
    <div id="cheesewrap"><div id="cheesezoom"></div></div>
    <div class="verdict" id="verdict">
      <p id="verdictText"></p>
      <small id="verdictTail"></small>
      <button id="again" aria-label="flip again">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1.5 4 1.5 10 7.5 10"/><path d="M4 15a9 9 0 1 0 2.1-9.4L1.5 10"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ================= Telegram ================= */
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    // each call is guarded: older Telegram clients throw on the newer methods
    const call = (fn) => { try { fn(); } catch (e) {} };
    call(() => tg.ready());
    call(() => tg.expand());
    call(() => tg.setHeaderColor('#1a1526'));
    call(() => tg.setBackgroundColor('#120d1c'));
    call(() => tg.disableVerticalSwipes());   // holding the paddle must not drag the app closed
    // deliberately not going fullscreen: there Telegram floats its own Close /
    // collapse / menu buttons over the page, right on top of this app's controls.
  }
  // Off by default - buzzing on every wind tick is a lot on a real phone.
  // Set localStorage 'cot_haptic' to '1' (or flip this default) to switch it back on.
  let hapticsOn = false;
  try { hapticsOn = localStorage.getItem('cot_haptic') === '1'; } catch (e) {}
  const haptic = (style) => {
    if (!hapticsOn || !tg || !tg.HapticFeedback) return;
    try {
      if (style === 'success' || style === 'error' || style === 'warning') tg.HapticFeedback.notificationOccurred(style);
      else tg.HapticFeedback.impactOccurred(style);
    } catch (e) {}
  };

  const SCENE_W = 390, SCENE_H = 780;
  let sceneK = 1;
  function fitViewport() {
    const h = (tg && tg.viewportStableHeight) ? tg.viewportStableHeight : window.innerHeight;
    const w = window.innerWidth;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    const sa = (tg && tg.safeAreaInset) || null;          // device notch / home indicator
    const ca = (tg && tg.contentSafeAreaInset) || null;   // Telegram's own chrome, inside that
    const st = ((sa && sa.top) || 0) + ((ca && ca.top) || 0);
    const sb = ((sa && sa.bottom) || 0) + ((ca && ca.bottom) || 0);
    document.documentElement.style.setProperty('--safe-t', st + 'px');
    document.documentElement.style.setProperty('--safe-b', sb + 'px');

    const usable = Math.max(320, h - st - sb);
    sceneK = Math.min(w / SCENE_W, usable / SCENE_H);
    const scene = document.getElementById('scene');
    if (scene) {
      scene.style.transform = 'scale(' + sceneK.toFixed(4) + ')';
      scene.style.top = (st + (usable - SCENE_H * sceneK) / 2) + 'px';
    }
    const fly = document.getElementById('fly');
    if (fly) { const px = Math.round(74 * sceneK); fly.style.width = px + 'px'; fly.style.height = px + 'px'; }
  }
  fitViewport();
  window.addEventListener('resize', fitViewport);
  if (tg && tg.onEvent) {
    ['viewportChanged', 'safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged']
      .forEach((e) => { try { tg.onEvent(e, fitViewport); } catch (err) {} });
  }

  /* ================= storage (may be blocked in a webview) ================= */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ================= sound ================= */
  let ac = null, muted = store.get('cot_muted', '0') === '1';
  const sndOn = document.getElementById('sndOn'), sndOff = document.getElementById('sndOff');
  const soundBtn = document.getElementById('sound');
  function paintSound() {
    sndOn.style.display = muted ? 'none' : 'block';
    sndOff.style.display = muted ? 'block' : 'none';
    soundBtn.classList.toggle('muted', muted);
  }
  paintSound();
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    store.set('cot_muted', muted ? '1' : '0');
    paintSound(); haptic('light');
  });
  function actx() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, type, dur, vol, glide) {
    if (muted) return;
    const c = actx(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(40, glide), c.currentTime + dur);
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  const sTick  = (n) => tone(340 + n * 46, 'square', 0.05, 0.055);
  const sSlip  = () => tone(180, 'sawtooth', 0.22, 0.09, 70);
  const sFling = () => tone(220, 'sawtooth', 0.3, 0.1, 1100);
  const sLand  = () => { tone(150, 'triangle', 0.2, 0.16, 70); tone(90, 'sine', 0.3, 0.12); };
  const sFlop  = () => tone(120, 'sine', 0.28, 0.12, 55);
  const sWord  = (i) => tone([523, 659, 784, 988, 1319][i] || 880, 'sine', 0.32, 0.1);
  const sLoad  = () => tone(600, 'sine', 0.09, 0.07, 900);

  /* ================= cheese geometry ================= */
  const HOLES = [
    { x: 50, y: 21,   r: 11.5 },
    { x: 29, y: 47,   r: 14   },
    { x: 69, y: 44,   r: 10.5 },
    { x: 38, y: 76,   r: 13   },
    { x: 73, y: 73,   r: 9    }
  ];
  function cheesePath() {
    // rounded slice + holes punched out (evenodd => genuinely transparent holes)
    let d = 'M14 2h72a12 12 0 0 1 12 12v72a12 12 0 0 1-12 12H14A12 12 0 0 1 2 86V14A12 12 0 0 1 14 2z';
    for (const h of HOLES) {
      d += ` M${h.x - h.r} ${h.y}a${h.r} ${h.r} 0 1 0 ${h.r * 2} 0a${h.r} ${h.r} 0 1 0 ${-h.r * 2} 0z`;
    }
    return d;
  }
  const CHEESE_D = cheesePath();
  function cheeseSVG(sw) {
    // the offset copy is the rind: it shows as a crescent at the silhouette and inside every hole
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="${CHEESE_D}" transform="translate(0 2.4)" fill="#c98718" fill-rule="evenodd"/>
      <path d="${CHEESE_D}" fill="url(#gCheese)" fill-rule="evenodd" stroke="#b9821a" stroke-width="${sw || 2.6}" stroke-linejoin="round"/>
    </svg>`;
  }
  document.getElementById('packCheese').setAttribute('d', CHEESE_D);
  document.getElementById('fly').innerHTML = cheeseSVG(3);
  // cheese riding on the arm
  document.getElementById('load').innerHTML =
    `<g transform="translate(126 42) scale(.68)">
       <path d="${CHEESE_D}" transform="translate(0 4)" fill="#c98718" fill-rule="evenodd"/>
       <path d="${CHEESE_D}" fill="url(#gCheese)" fill-rule="evenodd" stroke="#b9821a" stroke-width="3.4" stroke-linejoin="round"/>
     </g>`;

  /* ================= today's page ================= */
  /* Text comes live from ru.wikipedia (CC BY-SA, credited on the reveal); the
     built-in page below is only what shows when there is no network.          */
  const OFFLINE = {
    title: 'Молчание сыра',
    text: ('Страница на сегодня не открылась, и потому колесо говорит само за себя. ' +
           'Дырки — это окна, а окна не льстят. Не ищи ответа, которого хотел. ' +
           'Сыр помнит. Сыр терпелив. Сыр видел, чем ты занимался вчера, и у сыра есть мнение. ' +
           'Пусть ломоть падёт куда падёт, и читай что выпало, не пытаясь это исправить. ' +
           'Смысл берётся не из страницы, а из того, кто на неё смотрит. ').repeat(9)
  };

  let oracle = OFFLINE;
  let words = [];

  const pageLEl = document.getElementById('pageL');
  const pageREl = document.getElementById('pageR');
  const revealPageEl = document.getElementById('revealPage');

  function paintBook() {
    pageLEl.textContent = '';
    const h = document.createElement('em');
    h.className = 'bookttl';
    h.textContent = oracle.title || '';
    pageLEl.appendChild(h);
    pageLEl.appendChild(document.createTextNode(words.slice(0, 150).join(' ')));
    pageREl.textContent = words.slice(150, 330).join(' ');
  }

  function setOracle(o) {
    oracle = o;
    words = String(o.text).split(/\s+/).filter(Boolean);
    paintBook();
  }

  function stamp() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function tidyText(t) {
    return String(t)
      .replace(/=+\s*[^=\n]+\s*=+/g, ' ')   // == section headings ==
      .replace(/\[\d+\]/g, ' ')             // footnote markers
      .replace(/\s+/g, ' ')
      .trim();
  }

  // same pick all day, a different pick tomorrow
  function seeded(list, key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return list[h % list.length];
  }

  function loadOracle() {
    const day = stamp();
    try {
      const c = JSON.parse(store.get('cot_oracle', 'null'));
      if (c && c.day === day && c.text && c.text.length > 600) { setOracle(c); return; }
    } catch (e) {}

    const p = day.split('-');
    fetch('https://ru.wikipedia.org/api/rest_v1/feed/featured/' + p[0] + '/' + p[1] + '/' + p[2])
      .then((r) => r.json())
      .then((feed) => {
        const cands = [];
        if (feed.tfa && feed.tfa.titles) cands.push(feed.tfa.titles);
        const mr = (feed.mostread && feed.mostread.articles) || [];
        for (let i = 0; i < mr.length && cands.length < 14; i++) {
          const t = mr[i].titles;
          if (!t || !t.canonical) continue;
          // main page, service pages and bare lists read as tables, not as prose
          if (/^(Заглавная|Служебная|Категория|Файл|Шаблон|Портал|Список|Спи́сок)/.test(t.canonical.replace(/_/g, ' '))) continue;
          cands.push(t);
        }
        if (!cands.length) throw new Error('no article today');
        const pick = seeded(cands, day);
        return fetch('https://ru.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1' +
                     '&prop=extracts&explaintext=1&titles=' + encodeURIComponent(pick.canonical))
          .then((r) => r.json())
          .then((q) => {
            const pages = q.query.pages;
            const page = pages[Object.keys(pages)[0]];
            const text = tidyText(page.extract || '');
            if (text.split(' ').length < 150) throw new Error('page too thin');
            const o = { day: day, title: pick.normalized || page.title, text: text.slice(0, 30000) };
            setOracle(o);
            store.set('cot_oracle', JSON.stringify(o));
          });
      })
      .catch(() => { /* offline: the built-in page stands */ });
  }

  setOracle(OFFLINE);
  loadOracle();

  /* ================= score ================= */
  let score = parseInt(store.get('cot_score', '0'), 10) || 0;
  const scorePip = document.getElementById('score'), scoreN = document.getElementById('scoreN');
  function paintScore() {
    scoreN.textContent = score;
    scorePip.classList.toggle('on', score > 0);
  }
  paintScore();

  /* ================= machine rig ================= */
  const PIVOT = { x: 160, y: 205 };
  const REST = -14, MAXW = 86;           // arm angle at rest / fully wound (deg, clockwise)
  const GR = 150;                        // gauge radius, just past the paddle tip
  const SWEET_LO = 0.56, SWEET_HI = 0.86;
  const WIND_MS = 1500;                  // time to full tension
  const SLIP_HOLD = 420;                 // grace at full before the spring slips

  const armEl = document.getElementById('arm');
  const crankEl = document.getElementById('crank');
  const loadEl = document.getElementById('load');
  const rigEl = document.getElementById('rig');
  const gaugeEl = document.getElementById('gauge');
  const dotsEl = document.getElementById('dots').children;
  const inviteEl = document.getElementById('invite');
  const flyEl = document.getElementById('fly');
  const appEl = document.getElementById('app');
  const flashEl = document.getElementById('flash');

  const angleOf = (p) => REST + (MAXW - REST) * p;
  const polar = (r, deg) => {
    const a = deg * Math.PI / 180;
    return { x: PIVOT.x + r * Math.sin(a), y: PIVOT.y - r * Math.cos(a) };
  };
  function arc(r, a0, a1) {
    const s = polar(r, a0), e = polar(r, a1);
    const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    return `M${s.x.toFixed(1)} ${s.y.toFixed(1)}A${r} ${r} 0 ${large} ${a1 > a0 ? 1 : 0} ${e.x.toFixed(1)} ${e.y.toFixed(1)}`;
  }
  document.getElementById('gaugeTrack').setAttribute('d', arc(GR, angleOf(0), angleOf(1)));
  document.getElementById('gaugeSweet').setAttribute('d', arc(GR, angleOf(SWEET_LO), angleOf(SWEET_HI)));
  const gaugeFill = document.getElementById('gaugeFill');

  function setArm(deg) { armEl.setAttribute('transform', `rotate(${deg.toFixed(2)} ${PIVOT.x} ${PIVOT.y})`); }
  // pip thresholds are derived from the sweet window, so the two gold pips ARE the window
  const PIP = [0, SWEET_LO / 4, SWEET_LO / 2, SWEET_LO * 0.75, SWEET_LO, (SWEET_LO + SWEET_HI) / 2, SWEET_HI];
  const PIP_LIT = ['#2fd0c0', '#2fd0c0', '#2fd0c0', '#2fd0c0', '#ffd45e', '#ffd45e', '#ff5a5f'];
  const PIP_OFF = ['rgba(19,9,38,.42)', 'rgba(19,9,38,.42)', 'rgba(19,9,38,.42)', 'rgba(19,9,38,.42)',
                   'rgba(255,212,94,.26)', 'rgba(255,212,94,.26)', 'rgba(255,90,95,.28)'];
  for (let i = 0; i < 7; i++) dotsEl[i].setAttribute('fill', PIP_OFF[i]);

  function setPower(p) {
    setArm(angleOf(p));
    crankEl.setAttribute('transform', `rotate(${(p * 1080).toFixed(1)} 254 196)`);
    gaugeFill.setAttribute('d', p > 0.012 ? arc(GR, angleOf(0), angleOf(p)) : '');
    for (let i = 0; i < 7; i++) {
      const on = p > PIP[i] && p > 0.01;
      dotsEl[i].setAttribute('fill', on ? PIP_LIT[i] : PIP_OFF[i]);
      dotsEl[i].setAttribute('r', on ? 6.8 : 6);
    }
  }
  setArm(REST);

  /* ================= state ================= */
  const S = { IDLE: 0, WIND: 1, FIRE: 2, DONE: 3, RELOAD: 4 };
  let state = S.IDLE;
  let power = 0, windStart = 0, fullAt = 0, lastTick = -1, raf = 0;

  function screenPt(node, x, y) {
    const svg = node.ownerSVGElement;
    const pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
    const m = node.getScreenCTM();
    const o = pt.matrixTransform(m);
    const box = appEl.getBoundingClientRect();
    return { x: o.x - box.left, y: o.y - box.top };
  }

  /* ---------- winding ---------- */
  function beginWind(e) {
    if (state !== S.IDLE && state !== S.RELOAD) return;
    if (e && e.target.closest('#sound')) return;
    actx();
    state = S.WIND;
    power = 0; lastTick = -1;
    windStart = performance.now(); fullAt = 0;
    rigEl.classList.remove('breathe');
    inviteEl.style.opacity = '0';
    gaugeEl.style.transition = 'opacity .2s';
    gaugeEl.style.opacity = '1';
    raf = requestAnimationFrame(windLoop);
  }
  function windLoop(t) {
    if (state !== S.WIND) return;
    power = Math.min(1, (t - windStart) / WIND_MS);
    setPower(power);
    const tick = Math.floor(power * 12);
    if (tick !== lastTick) { lastTick = tick; sTick(tick); if (tick % 3 === 0) haptic('light'); }
    if (power >= 1) {
      if (!fullAt) fullAt = t;
      else if (t - fullAt > SLIP_HOLD) { sSlip(); haptic('warning'); return release(true); }
    }
    raf = requestAnimationFrame(windLoop);
  }

  /* ---------- release ---------- */
  function release(slipped) {
    if (state !== S.WIND) return;
    cancelAnimationFrame(raf);
    state = S.FIRE;
    const p = slipped ? 1 : power;
    gaugeEl.style.transition = 'opacity .45s'; gaugeEl.style.opacity = '0';
    sFling(); haptic('medium');

    const from = angleOf(p), t0 = performance.now(), SNAP = 220;
    let launched = false;
    (function snap(t) {
      const k = Math.min(1, (t - t0) / SNAP);
      // fast whip out, elastic settle back
      const e = k < 0.45
        ? from + (REST - 26 - from) * (k / 0.45)
        : (REST - 26) + (REST - (REST - 26)) * (1 - Math.pow(1 - (k - 0.45) / 0.55, 2));
      setArm(e);
      if (!launched && k > 0.32) { launched = true; launch(p); }
      if (k < 1) requestAnimationFrame(snap);
      else { crankEl.setAttribute('transform', 'rotate(0 254 196)'); setPower(0); }
    })(t0);
  }

  /* ---------- flight ---------- */
  function launch(p) {
    loadEl.style.opacity = '0';
    const start = screenPt(document.getElementById('muzzle'), 160, 72);

    const bookBox = document.getElementById('book').getBoundingClientRect();
    const app = appEl.getBoundingClientRect();
    const target = {
      x: bookBox.left - app.left + bookBox.width * 0.70,
      y: bookBox.top - app.top + bookBox.height * 0.52
    };
    const dx = target.x - start.x, dy = target.y - start.y;
    const dist = Math.hypot(dx, dy);
    const ux = dx / dist, uy = dy / dist;
    const near = dist - bookBox.height * 0.30, far = dist + bookBox.height * 0.30;

    // power -> travel distance (sweet window lands squarely on the page)
    let travel;
    if (p < SWEET_LO)      travel = (0.30 + 0.70 * (p / SWEET_LO)) * near;
    else if (p <= SWEET_HI) travel = near + (far - near) * ((p - SWEET_LO) / (SWEET_HI - SWEET_LO));
    else                    travel = far + (far * 0.42) * ((p - SWEET_HI) / (1 - SWEET_HI));
    const hit = p >= SWEET_LO && p <= SWEET_HI;

    const end = { x: start.x + ux * travel, y: start.y + uy * travel };
    const size = flyEl.offsetWidth || 74;
    const apex = Math.min(230, travel * 0.42);
    const dur = 520 + travel * 0.42;
    const spin = (hit ? 340 : 300) + Math.random() * 120;

    flyEl.style.display = 'block';
    const t0 = performance.now();
    (function fly(t) {
      const k = Math.min(1, (t - t0) / dur);
      const x = start.x + (end.x - start.x) * k;
      const y = start.y + (end.y - start.y) * k - Math.sin(k * Math.PI) * apex;
      const sc = 1 - 0.22 * Math.sin(k * Math.PI) * (hit ? 0.4 : 1) + (hit ? 0.10 * k : 0);
      flyEl.style.transform = `translate(${(x - size / 2).toFixed(1)}px, ${(y - size / 2).toFixed(1)}px) rotate(${(spin * k).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
      if (k < 1) requestAnimationFrame(fly);
      else hit ? landed(end, size) : missed(end, size, spin);
    })(t0);
  }

  function landed(end, size) {
    sLand(); haptic('rigid');
    flyEl.style.transform = `translate(${end.x - size / 2}px, ${end.y - size / 2}px) rotate(-7deg) scale(1.1)`;
    flashEl.animate([{ opacity: .42 }, { opacity: 0 }], { duration: 220, easing: 'ease-out' });
    appEl.animate(
      [{ transform: 'translateY(0)' }, { transform: 'translateY(5px)' }, { transform: 'translateY(0)' }],
      { duration: 160, easing: 'ease-out' }
    );
    score++; store.set('cot_score', String(score)); paintScore();
    setTimeout(() => reveal(end, size), 460);
  }

  function missed(end, size, spin) {
    sFlop(); haptic('error');
    const t0 = performance.now(), D = 460;
    (function settle(t) {
      const k = Math.min(1, (t - t0) / D);
      const bounce = Math.abs(Math.sin(k * Math.PI * 2)) * (1 - k) * 16;
      flyEl.style.opacity = String(1 - Math.max(0, (k - 0.6) / 0.4));
      flyEl.style.transform = `translate(${end.x - size / 2}px, ${end.y - size / 2 - bounce}px) rotate(${spin + k * 26}deg) scale(${1 - 0.12 * k})`;
      if (k < 1) requestAnimationFrame(settle);
      else reload();
    })(t0);
  }

  /* ---------- reload ---------- */
  function reload() {
    state = S.RELOAD;
    rigEl.classList.add('breathe');
    inviteEl.style.opacity = score > 0 ? '0' : '1';   // stop nagging once they've landed one
    flyEl.style.display = 'none';
    flyEl.style.opacity = '1';
    flyEl.style.transform = 'translate(-999px,-999px)';
    setArm(REST); setPower(0);
    // slice hops out of the pack into the shovel
    loadEl.style.transition = 'none';
    loadEl.style.transformBox = 'fill-box';
    loadEl.style.transformOrigin = 'center';
    loadEl.style.transform = 'translate(-96px, 92px) scale(.5) rotate(-40deg)';
    loadEl.style.opacity = '0';
    requestAnimationFrame(() => {
      loadEl.style.transition = 'transform .46s cubic-bezier(.2,1.2,.4,1), opacity .2s';
      loadEl.style.transform = 'none';
      loadEl.style.opacity = '1';
      sLoad();
      setTimeout(() => {
        if (state === S.RELOAD) state = S.IDLE;           // if they already grabbed it, leave them alone
      }, 460);
    });
  }

  /* ================= reveal ================= */
  const revealEl = document.getElementById('reveal');
  const zoomEl = document.getElementById('cheesezoom');
  const wrapEl = document.getElementById('cheesewrap');
  const verdictEl = document.getElementById('verdict');

  // drop the slice somewhere fresh on the page each time
  let revealRot = 0;
  function placeCheese() {
    const vw = window.innerWidth, vh = appEl.clientHeight || window.innerHeight;
    const w = wrapEl.offsetWidth, half = w / 2;
    const lo = half + vh * 0.04;
    const hi = Math.max(lo, vh * 0.55);
    const jitter = Math.max(0, (vw - w) / 2 - 8);
    const x = vw / 2 + (Math.random() * 2 - 1) * jitter;
    wrapEl.style.left = Math.max(half + 6, Math.min(vw - half - 6, x)) + 'px';
    wrapEl.style.top = (lo + Math.random() * (hi - lo)) + 'px';
    revealRot = Math.random() * 16 - 8;
  }

  // lay out a random stretch of today's article, one span per word
  function fillRevealPage() {
    const N = 320;
    const start = words.length > N ? Math.floor(Math.random() * (words.length - N)) : 0;
    const frag = document.createDocumentFragment();
    for (let i = start; i < Math.min(words.length, start + N); i++) {
      const sp = document.createElement('span');
      sp.textContent = words[i];
      frag.appendChild(sp);
      frag.appendChild(document.createTextNode(' '));
    }
    revealPageEl.textContent = '';
    revealPageEl.appendChild(frag);
  }

  // whichever word each hole came to rest over - no arranging, no second chances
  function wordsUnderHoles(box) {
    const spans = revealPageEl.children, n = spans.length;
    if (!n) return [];
    const rects = new Array(n);
    for (let i = 0; i < n; i++) rects[i] = spans[i].getBoundingClientRect();

    const cx0 = box.left + box.width / 2, cy0 = box.top + box.height / 2;
    const a = revealRot * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    const used = {}, out = [];

    for (const h of HOLES) {
      const ox = (h.x - 50) / 100 * box.width, oy = (h.y - 50) / 100 * box.height;
      const cx = cx0 + ox * ca - oy * sa;
      const cy = cy0 + ox * sa + oy * ca;
      const r = h.r / 100 * box.width;
      let best = -1, bestD = Infinity;
      for (let i = 0; i < n; i++) {
        if (used[i]) continue;
        const b = rects[i];
        if (!b.width) continue;
        const bx = b.left + b.width / 2, by = b.top + b.height / 2;
        if (Math.abs(by - cy) > r) continue;                       // not on a line the hole crosses
        if (b.right < cx - r || b.left > cx + r) continue;         // clear of the opening
        // a hole usually spans two or three words; take the one nearest the centre,
        // but let a longer word out-pull a two-letter conjunction
        const d = Math.hypot(bx - cx, by - cy) - Math.min(spans[i].textContent.length, 14) * r * 0.05;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) { used[best] = 1; out.push(spans[best]); } else out.push(null);
    }
    return out;
  }

  const tidyWord = (w) => w.replace(/^[^0-9A-Za-zА-Яа-яЁё]+/, '').replace(/[^0-9A-Za-zА-Яа-яЁё%]+$/, '');

  function whenFontsReady(cb) {
    try {
      if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
        document.fonts.ready.then(cb).catch(cb);
        return;
      }
    } catch (e) {}
    cb();
  }

  let revealGen = 0;
  function reveal(end, size) {
    state = S.DONE;
    const gen = ++revealGen;

    fillRevealPage();
    zoomEl.innerHTML = cheeseSVG(2.4);
    verdictEl.classList.remove('on');
    revealEl.style.display = 'block';       // must be laid out before anything is measured
    placeCheese();

    const wrapBox = wrapEl.getBoundingClientRect(), app = appEl.getBoundingClientRect();

    // zoom in from wherever the slice actually landed on the little book
    const sc = size / wrapBox.width;
    const tx = (end.x + app.left) - (wrapBox.left + wrapBox.width / 2);
    const ty = (end.y + app.top) - (wrapBox.top + wrapBox.height / 2);
    zoomEl.style.transition = 'none';
    zoomEl.style.transform = `translate(${tx}px, ${ty}px) scale(${sc}) rotate(-7deg)`;

    requestAnimationFrame(() => {
      revealEl.classList.add('on');
      zoomEl.style.transition = 'transform .95s cubic-bezier(.18,.85,.25,1)';
      zoomEl.style.transform = `rotate(${revealRot.toFixed(2)}deg)`;
      flyEl.style.display = 'none';
    });

    const t0 = performance.now();
    whenFontsReady(() => {
      if (gen !== revealGen) return;                       // already flipped again
      const picks = wordsUnderHoles(wrapEl.getBoundingClientRect());
      const late = performance.now() - t0;
      const at = (ms) => Math.max(0, ms - late);

      picks.forEach((sp, i) => setTimeout(() => {
        if (gen !== revealGen) return;
        if (sp) sp.classList.add('pick');
        sWord(i);
        haptic(i === picks.length - 1 ? 'success' : 'light');
      }, at(950 + i * 340)));

      setTimeout(() => {
        if (gen !== revealGen) return;
        const got = picks.filter(Boolean).map((sp) => tidyWord(sp.textContent)).filter(Boolean);
        const line = got.length ? got.join(' ') : '…';
        const vt = document.getElementById('verdictText');
        // Russian words are long; let the reading shrink rather than run down the screen
        vt.style.fontSize = line.length > 58 ? 'clamp(17px,4.9vw,22px)'
                          : line.length > 38 ? 'clamp(19px,5.6vw,25px)'
                                             : 'clamp(21px,6.4vw,29px)';
        vt.textContent = line;
        document.getElementById('verdictTail').textContent = 'Википедия · ' + (oracle.title || '');
        verdictEl.classList.add('on');
        haptic('success');
      }, at(950 + picks.length * 340 + 180));
    });
  }

  function closeReveal() {
    if (state !== S.DONE) return;
    state = S.FIRE;
    revealEl.classList.remove('on');
    verdictEl.classList.remove('on');
    setTimeout(() => { revealEl.style.display = 'none'; reload(); }, 480);
  }
  document.getElementById('again').addEventListener('click', (e) => { e.stopPropagation(); closeReveal(); });
  revealEl.addEventListener('pointerdown', (e) => {
    if (verdictEl.classList.contains('on')) { e.preventDefault(); closeReveal(); }
  });

  /* ================= input: hold anywhere, let go ================= */
  appEl.addEventListener('pointerdown', (e) => {
    if (state !== S.IDLE && state !== S.RELOAD) return;
    if (e.target.closest('#sound')) return;   // let the toggle take its own tap
    e.preventDefault();
    beginWind(e);
  }, { passive: false });
  const up = () => { if (state === S.WIND) release(false); };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  window.addEventListener('blur', up);
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  /* ================= boot ================= */
  reload();
})();
</script>
</body>
</html>
